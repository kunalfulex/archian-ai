# Archian AI local quickstart (community edition).
# File uploads stay on a Docker volume (local disk) — no AWS/S3 required.
# SQL/CSV and file flows work with only OPENAI_API_KEY + JWT_SECRET.
# Salesforce / Google OAuth are optional — see README and backend/.env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archian
      POSTGRES_PASSWORD: archian
      POSTGRES_DB: archian
    ports:
      - "5432:5432"
    volumes:
      - archian_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archian -d archian"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      ARCHIAN_EDITION: ${ARCHIAN_EDITION:-community}
      DB_URL: ${DB_URL:-postgresql://archian:archian@postgres:5432/archian}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-only}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      # Community: store uploads on the container volume (not Archian S3)
      FILE_STORAGE: ${FILE_STORAGE:-local}
      LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-/data/uploads}
      RUNNING_IN_DOCKER: "true"
      PORT: "8000"
    volumes:
      - archian_uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
      HOST: "0.0.0.0"
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  archian_pg:
  archian_uploads:
  frontend_node_modules:
